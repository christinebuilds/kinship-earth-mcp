# Reference events for scoring the flow detector (spec 016).
# Every entry cites a source that was opened, not written from memory.
# Sourced 2026-11-19. All current entries come from the USGS annual peak-flow
# record (instantaneous peaks), a separate product from the daily means the
# detector uses. Each gives one peak date, so start = end = peak day.
# Drought (low_flow) events are missing: their sources (USBR, CA Water Boards,
# DWR, NOAA CNRFC, pubs.usgs.gov) were not reachable from the runner's network.
# Gauges checked against time-series-metadata (daily discharge, 00060/00003):
#   11467000 from 1939-10-01 | 11477000 from 1910-10-01 | 11530500 from 1910-10-01
#   11425500 from 1929-10-01 | 11303500 from 1923-10-01
events:
  - id: russian-1986-02-flood
    kind: high_flow
    site_id: USGS-11467000
    start: 1986-02-18
    end: 1986-02-18
    title: February 1986 Russian River peak (largest in gauge record)
    source: "https://api.waterdata.usgs.gov/ogcapi/v0/collections/peaks/items?monitoring_location_id=USGS-11467000&parameter_code=00060&f=json&limit=200"
    source_type: agency
    note: "USGS annual peak 102,000 cfs on 1986-02-18 (regulated), highest in this gauge's peak record."
